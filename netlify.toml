[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"


# Old domain → new domain (keeps links and search rankings).
[[redirects]]
  from = "https://nityanpolymers.com/*"
  to = "https://akshitarecycle.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.nityanpolymers.com/*"
  to = "https://akshitarecycle.com/:splat"
  status = 301
  force = true
